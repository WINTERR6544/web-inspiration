<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Inspiration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky toolbar over a fluid auto-fill card grid; one ultramarine accent on cool neutrals. */
:root {
  --bg: #f5f6f9;
  --surface: #ffffff;
  --fg: #14161f;
  --muted: #5d6275;
  --line: #dfe2ea;
  --chip: #eceef4;
  --accent: #3b3bf0;
  --accent-soft: #e5e5fe;
  --on-accent: #ffffff;
  --heart: #e0305a;
  --shadow: 0 1px 2px rgba(20, 22, 40, .06), 0 8px 24px -12px rgba(20, 22, 40, .18);
  --shadow-hover: 0 2px 4px rgba(20, 22, 40, .06), 0 22px 40px -18px rgba(30, 30, 120, .35);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f15;
    --surface: #171923;
    --fg: #eceef6;
    --muted: #9aa0b5;
    --line: #2a2d3b;
    --chip: #222533;
    --accent: #8f8fff;
    --accent-soft: #25264a;
    --on-accent: #0e0f15;
    --heart: #ff5c80;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6);
    --shadow-hover: 0 2px 4px rgba(0, 0, 0, .3), 0 22px 40px -18px rgba(90, 90, 255, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f15;
  --surface: #171923;
  --fg: #eceef6;
  --muted: #9aa0b5;
  --line: #2a2d3b;
  --chip: #222533;
  --accent: #8f8fff;
  --accent-soft: #25264a;
  --on-accent: #0e0f15;
  --heart: #ff5c80;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6);
  --shadow-hover: 0 2px 4px rgba(0, 0, 0, .3), 0 22px 40px -18px rgba(90, 90, 255, .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { max-width: 1240px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); }

/* Header */
.masthead { padding-block: 40px 24px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.masthead h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2.2rem, 6vw, 3.6rem);
  line-height: 1;
  letter-spacing: -0.035em;
  margin: 0;
  text-wrap: balance;
}
.masthead h1 span { color: var(--accent); }
.masthead p { margin: 10px 0 0; color: var(--muted); max-width: 52ch; }
.theme-btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 14px; cursor: pointer;
  font-size: 13px; font-weight: 500;
  transition: border-color .2s;
}
.theme-btn:hover { border-color: var(--accent); }
.theme-btn svg { width: 16px; height: 16px; }

/* Toolbar */
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.toolbar .wrap { padding-block: 14px; display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search {
  flex: 1 1 260px; min-width: 0; position: relative;
}
.search svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; height: 40px; padding: 0 12px 0 36px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  transition: border-color .2s, box-shadow .2s;
}
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.select {
  height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer;
}
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; user-select: none; white-space: nowrap; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track {
  width: 36px; height: 20px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line);
  position: relative; transition: background .2s, border-color .2s;
}
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--muted); transition: transform .2s, background .2s;
}
.switch input:checked + .track { background: var(--heart); border-color: var(--heart); }
.switch input:checked + .track::after { transform: translateX(16px); background: #fff; }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

.filters { display: grid; gap: 8px; }
.filter-group { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.filter-label {
  flex: 0 0 72px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip {
  border: 1px solid transparent; background: var(--chip); border-radius: 999px;
  padding: 4px 12px; font-size: 13px; cursor: pointer; line-height: 1.4;
  transition: background .15s, color .15s, border-color .15s;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip .n { font-family: var(--font-mono); font-size: 11px; opacity: .65; margin-left: 4px; }

.status { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.clear {
  border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; padding: 4px 0;
}
.clear:disabled { color: var(--muted); opacity: .5; cursor: default; }

/* Grid */
main .wrap { padding-block: 28px 64px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 24px; }

.card {
  position: relative; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
  transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s, border-color .25s;
}
.card:hover, .card:focus-within { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }

.preview {
  position: relative; aspect-ratio: 16 / 10; max-width: 100%;
  background: var(--c); color: var(--ink); overflow: hidden;
}
.preview .bar {
  display: flex; gap: 5px; align-items: center; padding: 9px 11px;
  background: color-mix(in srgb, var(--ink) 10%, transparent);
}
.preview .bar i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .35; }
.preview .bar span { margin-left: 8px; font-family: var(--font-mono); font-size: 10px; opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preview .mock { position: absolute; inset: 34px 16px 16px; display: grid; gap: 7px; align-content: start; transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.card:hover .preview .mock { transform: translateY(-3px) scale(1.02); }
.preview .word {
  font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: -0.03em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.preview .ln { height: 6px; border-radius: 3px; background: currentColor; opacity: .22; }
.preview .blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
.preview .blocks b { aspect-ratio: 4 / 3; border-radius: 4px; background: currentColor; opacity: .14; }
.preview .hex {
  position: absolute; right: 10px; bottom: 8px; font-family: var(--font-mono); font-size: 10px; opacity: .6; text-transform: uppercase;
}

.preview.shot img {
  display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center;
  transition: transform .45s cubic-bezier(.2,.7,.3,1);
}
.card:hover .preview.shot img { transform: scale(1.04); }

.body { padding: 16px 16px 18px; display: grid; gap: 8px; flex: 1; align-content: start; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cat { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.date { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; letter-spacing: -0.02em; line-height: 1.2; margin: 0; padding-right: 36px; }
.card .open { all: unset; cursor: pointer; }
.card .open::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: var(--radius); }
.card .open:focus-visible::after { outline: 2px solid var(--accent); outline-offset: -2px; }
.desc { margin: 0; color: var(--muted); font-size: 14px; }
.domain { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--chip); color: var(--muted); }

.fav {
  position: absolute; z-index: 2; right: 12px; top: 12px;
  width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  color: var(--muted); box-shadow: 0 2px 8px rgba(0,0,0,.12);
  transition: transform .2s, color .2s;
}
.fav:hover { transform: scale(1.1); color: var(--heart); }
.fav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
.fav[aria-pressed="true"] { color: var(--heart); }
.fav[aria-pressed="true"] svg { fill: currentColor; }
.fav.pop svg { animation: pop .35s ease; }
@keyframes pop { 40% { transform: scale(1.35); } }

/* Enlarged view */
.modal {
  width: min(960px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0;
  border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--fg);
  box-shadow: 0 30px 80px -20px rgba(10, 10, 40, .5); overflow: auto;
}
.modal::backdrop { background: rgba(10, 11, 20, .55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.modal[open] { animation: rise .28s cubic-bezier(.2,.7,.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } }
.modal .preview { aspect-ratio: auto; min-height: 240px; }
.modal .preview.shot img { height: auto; max-height: 52vh; object-fit: contain; background: var(--c); }
.modal .preview:not(.shot) { aspect-ratio: 16 / 9; }
.modal .preview:not(.shot) .word { font-size: clamp(32px, 6vw, 56px); }
.modal .preview:not(.shot) .mock { inset: 48px 32px 32px; gap: 12px; }
.modal-close {
  position: absolute; z-index: 3; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center; font-size: 20px; line-height: 1;
  background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--fg); box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.modal .fav { right: 56px; }
.modal-body { padding: 22px 24px 26px; display: grid; gap: 14px; }
.modal-body h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -0.03em; line-height: 1.1; margin: 0; text-wrap: balance; }
.modal-body .desc { font-size: 15px; max-width: 65ch; }
.swatch { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-transform: uppercase; }
.swatch i { width: 14px; height: 14px; border-radius: 4px; background: var(--c); border: 1px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; color: var(--fg);
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.copy-out {
  margin: 0; padding: 14px 16px; border-radius: 12px; background: var(--chip); color: var(--fg);
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 240px; overflow: auto;
}
.copy-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.toast {
  position: fixed; z-index: 50; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.empty { text-align: center; padding: 64px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty strong { display: block; font-family: var(--font-display); font-size: 1.4rem; color: var(--fg); margin-bottom: 6px; }
.empty button { margin-top: 14px; border: 0; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 8px 18px; font-weight: 600; cursor: pointer; }

@media (max-width: 560px) {
  .modal { width: 100%; max-width: 100%; max-height: 92%; margin: auto 0 0; border-radius: 18px 18px 0 0; }
  .modal-body { padding: 18px 16px calc(22px + env(safe-area-inset-bottom, 0px)); }
  .modal .preview { min-height: 0; }
  .actions .btn { flex: 1 1 auto; justify-content: center; }
  .masthead { padding-block: 28px 18px; }
  .toolbar { position: static; }
  .filter-group { flex-direction: column; gap: 6px; }
  .filter-label { flex: none; }
  .select { flex: 1 1 auto; }
  .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; max-width: 100%; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<header class="wrap masthead">
  <div>
    <h1>Web Inspiration<span>.</span></h1>
    <p>A working shelf of <span id="total">24</span> websites worth studying for layout, type and interaction. Filter by category or style, and heart the ones you want to come back to.</p>
  </div>
  <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle light and dark theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span id="themeLabel">Dark mode</span>
  </button>
</header>

<section class="toolbar" aria-label="Search and filters">
  <div class="wrap">
    <div class="row">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search titles and descriptions" autocomplete="off" aria-label="Search titles and descriptions">
      </label>
      <select id="sort" class="select" aria-label="Sort">
        <option value="newest">Newest first</option>
        <option value="az">A–Z</option>
      </select>
      <label class="switch">
        <input id="favOnly" type="checkbox">
        <span class="track" aria-hidden="true"></span>
        Favorites only
      </label>
    </div>
    <div class="filters">
      <div class="filter-group">
        <span class="filter-label" id="catLabel">Category</span>
        <div class="chips" id="catChips" role="group" aria-labelledby="catLabel"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label" id="tagLabel">Style</span>
        <div class="chips" id="tagChips" role="group" aria-labelledby="tagLabel"></div>
      </div>
    </div>
    <div class="status">
      <span class="count" id="count" aria-live="polite"></span>
      <button class="clear" id="clear" type="button">Clear filters</button>
    </div>
  </div>
</section>

<main>
  <div class="wrap">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <strong>No sites match</strong>
      Try fewer style tags, another category, or a different search.
      <br><button type="button" id="emptyClear">Clear filters</button>
    </div>
  </div>
</main>

<dialog class="modal" id="modal" aria-labelledby="mTitle">
  <div id="mPreview"></div>
  <button type="button" class="modal-close" id="mClose" aria-label="Close">×</button>
  <button type="button" class="fav" id="mFav" aria-pressed="false" aria-label="Add to favorites">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8.2 3.4 4.5 7 4.5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.6 0 5.5 3.7 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>
  </button>
  <div class="modal-body">
    <div class="meta"><span class="cat" id="mCat"></span><span class="date" id="mDate"></span></div>
    <h2 id="mTitle"></h2>
    <p class="desc" id="mDesc"></p>
    <div class="row"><span class="swatch" id="mSwatch"><i></i><span></span></span><div class="tags" id="mTags"></div></div>
    <div class="actions">
      <button type="button" class="btn primary" id="copyPrompt">Copy prompt</button>
      <button type="button" class="btn" id="copyBrief">Copy brief</button>
      <a class="btn" id="mVisit" target="_blank" rel="noopener noreferrer">Visit site ↗</a>
    </div>
    <span class="copy-label" id="copyLabel">Prompt</span>
    <pre class="copy-out" id="copyOut" tabindex="0"></pre>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SITES = [
  { title: "Linear", url: "https://linear.app", category: "SaaS", tags: ["dark", "minimal", "motion"], description: "Issue tracking sold through crisp product shots, subtle gradients and tight typographic rhythm.", color: "#1b1c2e", added: "2026-09-24" },
  { title: "Stripe", url: "https://stripe.com", category: "SaaS", tags: ["colorful", "motion"], description: "Payments infrastructure with a flowing animated gradient hero and meticulous grid discipline.", color: "#635bff", added: "2026-09-02" },
  { title: "Vercel", url: "https://vercel.com", category: "SaaS", tags: ["dark", "minimal"], description: "Monochrome developer platform page built on sharp contrast, geometric type and code snippets.", color: "#0a0a0a", added: "2026-08-19" },
  { title: "Notion", url: "https://www.notion.com", category: "SaaS", tags: ["illustrated", "playful", "minimal"], description: "Black-and-white hand-drawn characters keep a dense productivity story friendly and light.", color: "#f7f6f3", added: "2026-07-30" },
  { title: "Raycast", url: "https://www.raycast.com", category: "SaaS", tags: ["dark", "3D", "motion"], description: "Launcher app shown in glossy dark 3D renders with a keyboard-first product narrative.", color: "#ff6363", added: "2026-09-15" },
  { title: "Figma", url: "https://www.figma.com", category: "SaaS", tags: ["colorful", "playful"], description: "Saturated color blocks and oversized type that mirror the collaborative canvas itself.", color: "#a259ff", added: "2026-06-11" },
  { title: "Pentagram", url: "https://www.pentagram.com", category: "Agency", tags: ["minimal", "editorial"], description: "A partner-led studio whose site steps aside and lets the case study imagery carry the page.", color: "#e8e6e1", added: "2026-05-28" },

const STORE_FAV = "webinsp:favorites";
const STORE_THEME = "webinsp:theme";
const read = (k, fallback) => { try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const state = {
  q: "",
  cats: new Set(),
  tags: new Set(),
  sort: "newest",
  favOnly: false,
  favs: new Set(read(STORE_FAV, []))
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Favorites are keyed by URL; cards without a link use their title instead.
const keyOf = (s) => s.url || "title:" + s.title;
const domain = (u) => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
const inkFor = (hex) => {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.4 ? "#15161c" : "#ffffff";
};
const fmtDate = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

const CATEGORIES = [...new Set(SITES.map((s) => s.category))];
const TAGS = [...new Set(SITES.flatMap((s) => s.tags))].sort();

function buildChips(el, values, set, key) {
  el.innerHTML = values.map((v) => {
    const n = SITES.filter((s) => key === "cat" ? s.category === v : s.tags.includes(v)).length;
    return `<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="false">${esc(v)}<span class="n">${n}</span></button>`;
  }).join("");
  el.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    const v = btn.dataset.v;
    set.has(v) ? set.delete(v) : set.add(v);
    render();
  });
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  let list = SITES.filter((s) =>
    (!q || s.title.toLowerCase().includes(q) || s.description.toLowerCase().includes(q)) &&
    (!state.cats.size || state.cats.has(s.category)) &&
    [...state.tags].every((t) => s.tags.includes(t)) &&
    (!state.favOnly || state.favs.has(keyOf(s)))
  );
  list.sort(state.sort === "az"
    ? (a, b) => a.title.localeCompare(b.title)
    : (a, b) => b.added.localeCompare(a.added));
  return list;
}

function previewHtml(s, eager) {
  const where = s.url ? esc(domain(s.url)) : "screenshot";
  return s.image
    ? `<div class="preview shot" style="--c:${s.color};--ink:${inkFor(s.color)}">
      <img src="${esc(s.image)}" alt="Screenshot of the ${esc(s.title)} design" loading="${eager ? "eager" : "lazy"}" decoding="async">
    </div>`
    : `<div class="preview" style="--c:${s.color};--ink:${inkFor(s.color)}" aria-hidden="true">
      <div class="bar"><i></i><i></i><i></i><span>${where}</span></div>
      <div class="mock">
        <div class="word">${esc(s.title)}</div>
        <div class="ln" style="width:72%"></div>
        <div class="ln" style="width:48%"></div>
        <div class="blocks"><b></b><b></b><b></b></div>
      </div>
      <span class="hex">${esc(s.color)}</span>
    </div>`;
}

function card(s) {
  const key = keyOf(s);
  const fav = state.favs.has(key);
  const where = s.url ? esc(domain(s.url)) : "screenshot";
  const preview = previewHtml(s);
  const title = `<button type="button" class="open" data-key="${esc(key)}" aria-haspopup="dialog">${esc(s.title)}</button>`;
  return `<article class="card">
    ${preview}
    <button type="button" class="fav" data-key="${esc(key)}" aria-pressed="${fav}" aria-label="${fav ? "Remove" : "Add"} ${esc(s.title)} ${fav ? "from" : "to"} favorites">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8.2 3.4 4.5 7 4.5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.6 0 5.5 3.7 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>
    </button>
    <div class="body">
      <div class="meta"><span class="cat">${esc(s.category)}</span><span class="date" title="Added to collection">${fmtDate(s.added)}</span></div>
      <h2>${title}</h2>
      <p class="desc">${esc(s.description)}</p>
      <span class="domain">${s.url ? where : "Screenshot · no link yet"}</span>
      <div class="tags">${s.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    </div>
  </article>`;
}

function render() {
  const list = filtered();
  $("grid").innerHTML = list.map(card).join("");
  $("empty").hidden = list.length > 0;
  $("grid").hidden = list.length === 0;
  const favCount = state.favs.size;
  $("count").textContent = `Showing ${list.length} of ${SITES.length} sites · ${favCount} favorite${favCount === 1 ? "" : "s"}`;
  for (const [el, set] of [[$("catChips"), state.cats], [$("tagChips"), state.tags]]) {
    el.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", set.has(b.dataset.v)));
  }
  $("clear").disabled = !(state.q || state.cats.size || state.tags.size || state.favOnly);
}

function clearFilters() {
  state.q = ""; state.cats.clear(); state.tags.clear(); state.favOnly = false;
  $("q").value = ""; $("favOnly").checked = false;
  render();
}

buildChips($("catChips"), CATEGORIES, state.cats, "cat");
buildChips($("tagChips"), TAGS, state.tags, "tag");
$("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
$("favOnly").addEventListener("change", (e) => { state.favOnly = e.target.checked; render(); });
$("clear").addEventListener("click", clearFilters);
$("emptyClear").addEventListener("click", clearFilters);

function toggleFav(key) {
  state.favs.has(key) ? state.favs.delete(key) : state.favs.add(key);
  write(STORE_FAV, [...state.favs]);
  render();
}

$("grid").addEventListener("click", (e) => {
  const open = e.target.closest(".open");
  if (open) { openModal(open.dataset.key, open); return; }
  const btn = e.target.closest(".fav");
  if (!btn) return;
  const key = btn.dataset.key;
  toggleFav(key);
  const again = $("grid").querySelector(`.fav[data-key="${CSS.escape(key)}"]`);
  if (again) { again.classList.add("pop"); again.focus(); }
});

// What each style tag asks a designer to carry over.
const TAG_NOTES = {
  minimal: "restraint: few colors, lots of whitespace, every element earns its place",
  dark: "dark surfaces with light type and careful contrast",
  brutalist: "raw structure, hard edges, visible grid and default-feeling type",
  playful: "unexpected shapes, friendly motion and personality in the details",
  editorial: "magazine-grade type hierarchy and long-form reading rhythm",
  colorful: "bold, saturated color used as a structural element",
  motion: "purposeful animation and scroll choreography",
  "3D": "rendered 3D objects or depth as the focal point",
  illustrated: "custom illustration carrying the brand voice",
  fantasy: "a mythic, otherworldly mood: rich lore-driven art, ornamental details and dramatic lighting"
};
const PAGE_KIND = { Gaming: "game website", Brand: "brand homepage", Experience: "interactive web experience", SaaS: "product landing page", "E-commerce": "online store homepage", Agency: "studio homepage", Portfolio: "personal portfolio", Blog: "blog homepage", Education: "course landing page" };
const withArticle = (w) => (/^[aeiou]/i.test(w) ? "an " : "a ") + w;
const refOf = (s) => s.url || "a saved screenshot (no public link)";

function promptFor(s) {
  const kind = PAGE_KIND[s.category] || "landing page";
  return [
    `Design ${withArticle(kind)} in the style of "${s.title}" (reference: ${refOf(s)}).`,
    ``,
    `Reference in one line: ${s.description}`,
    ``,
    `Visual direction:`,
    ...s.tags.map((t) => `- ${t}: ${TAG_NOTES[t] || t}`),
    `- Key color: ${s.color.toUpperCase()}, used as the dominant tone, with neutrals tuned to it.`,
    ``,
    `Requirements: responsive down to 375px, generous spacing, a clear type scale, smooth hover states and accessible contrast.`,
    `Match the mood, layout ideas and craft of the reference, but use original copy, imagery and branding.`
  ].join("\n");
}

function briefFor(s) {
  return [
    `DESIGN BRIEF: ${s.title}`,
    ``,
    `Reference: ${refOf(s)}`,
    `Category: ${s.category}`,
    `Style: ${s.tags.join(", ")}`,
    `Key color: ${s.color.toUpperCase()}`,
    ``,
    `What it does well:`,
    s.description,
    ``,
    `Take from it:`,
    ...s.tags.map((t) => `- ${TAG_NOTES[t] ? TAG_NOTES[t][0].toUpperCase() + TAG_NOTES[t].slice(1) : t}`),
    ``,
    `Deliverable: ${withArticle(PAGE_KIND[s.category] || "landing page")} that borrows this direction without copying its content or branding.`
  ].join("\n");
}

const modal = $("modal");
let current = null;
let lastOpener = null;

function showCopy(kind) {
  const text = kind === "brief" ? briefFor(current) : promptFor(current);
  $("copyOut").textContent = text;
  $("copyLabel").textContent = kind === "brief" ? "Brief" : "Prompt";
  $("copyPrompt").classList.toggle("primary", kind !== "brief");
  $("copyBrief").classList.toggle("primary", kind === "brief");
  return text;
}

function syncModalFav() {
  const on = state.favs.has(keyOf(current));
  $("mFav").setAttribute("aria-pressed", on);
  $("mFav").setAttribute("aria-label", `${on ? "Remove" : "Add"} ${current.title} ${on ? "from" : "to"} favorites`);
}

function openModal(key, opener) {
  current = SITES.find((s) => keyOf(s) === key);
  if (!current) return;
  lastOpener = opener || null;
  $("mPreview").innerHTML = previewHtml(current, true);
  $("mCat").textContent = current.category;
  $("mDate").textContent = "Added " + fmtDate(current.added);
  $("mTitle").textContent = current.title;
  $("mDesc").textContent = current.description;
  $("mSwatch").style.setProperty("--c", current.color);
  $("mSwatch").querySelector("span").textContent = current.color;
  $("mTags").innerHTML = current.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("");
  $("mVisit").hidden = !current.url;
  if (current.url) $("mVisit").href = current.url;
  syncModalFav();
  showCopy("prompt");
  if (typeof modal.showModal === "function") modal.showModal(); else modal.setAttribute("open", "");
  $("mClose").focus();
}

function closeModal() {
  if (modal.open) modal.close ? modal.close() : modal.removeAttribute("open");
}
modal.addEventListener("close", () => {
  if (lastOpener && document.contains(lastOpener)) lastOpener.focus();
});
$("mClose").addEventListener("click", closeModal);
modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function copy(kind) {
  const text = showCopy(kind);
  const label = kind === "brief" ? "Brief" : "Prompt";
  const selectFallback = () => {
    const range = document.createRange();
    range.selectNodeContents($("copyOut"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    toast(`${label} selected. Press Ctrl+C or Cmd+C to copy.`);
  };
  try {
    navigator.clipboard.writeText(text).then(() => toast(`${label} copied`), selectFallback);
  } catch { selectFallback(); }
}
$("copyPrompt").addEventListener("click", () => copy("prompt"));
$("copyBrief").addEventListener("click", () => copy("brief"));

$("mFav").addEventListener("click", () => {
  toggleFav(keyOf(current));
  syncModalFav();
  $("mFav").classList.remove("pop"); void $("mFav").offsetWidth; $("mFav").classList.add("pop");
});

// Theme: follows the system until the user picks one, then remembers it.
const root = document.documentElement;
const mq = window.matchMedia("(prefers-color-scheme: dark)");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : mq.matches;
const syncThemeLabel = () => { $("themeLabel").textContent = isDark() ? "Light mode" : "Dark mode"; };
const savedTheme = read(STORE_THEME, null);
if (savedTheme === "dark" || savedTheme === "light") root.dataset.theme = savedTheme;
$("themeBtn").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  root.dataset.theme = next;
  write(STORE_THEME, next);
  syncThemeLabel();
});
mq.addEventListener?.("change", syncThemeLabel);
syncThemeLabel();

$("total").textContent = SITES.length;
render();
</script>
</body>
</html>
